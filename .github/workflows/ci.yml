# Lint and the offline tests on every push and pull request.
# The tests need no keys and no network: DuckDB stands in for BigQuery, and fakes stand in
# for Gemini. The live eval (`da-assistant eval`) needs keys, so it is not run here.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # The Python version comes from .python-version; --locked fails if uv.lock is stale.
      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest
