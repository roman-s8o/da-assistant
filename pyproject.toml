[project]
name = "da-assistant"
version = "0.1.0"
description = "A chat assistant that answers sales questions with BigQuery and Gemini."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-bigquery[pandas]>=3.47.0",
    "google-genai>=2.34.0",
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.18",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sqlglot>=30.26.0",
    "tenacity>=9.1.4",
    "typer>=0.27.3",
]

[project.scripts]
da-assistant = "da_assistant.cli:app"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "duckdb>=2.0.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# The client's file. We keep it exactly as they wrote it.
extend-exclude = ["src/da_assistant/bq_client.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
